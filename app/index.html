<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e0f11">
<title>Nuts Tips Uygulaması</title>
<style>
:root{color-scheme:dark;--bg:#0e0f11;--surface:#17191c;--border:#262a30;--text:#eef1f5;--muted:#9aa3ae;--accent:#c9a24e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.card{width:min(430px,calc(100% - 32px));padding:32px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:20px}
.brand{font-size:26px;font-weight:800;letter-spacing:-.6px}.brand span{color:var(--accent)}
p{margin:18px 0 25px;color:var(--muted);line-height:1.5}
.actions{display:flex;flex-direction:column;gap:10px}
a{min-height:48px;display:grid;place-items:center;padding:0 18px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:700}
.primary{background:var(--accent);color:var(--bg)}.secondary{color:var(--text);border:1px solid var(--border)}
</style>
</head>
<body>
<main class="card">
  <div class="brand">Nuts<span> Tips</span></div>
  <p>Maç seçimleri, olasılıklar ve analizler Nuts Tips'te.</p>
  <div class="actions">
    <a class="primary" href="https://apps.apple.com/app/id6781012939">App Store'da Gör</a>
    <a class="secondary" href="/">Web Sitesine Git</a>
  </div>
</main>
</body>
</html>
