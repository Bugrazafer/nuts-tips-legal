<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08090b">
<title>Nuts Tips’i Aç</title>
<style>
:root{--bg:#08090b;--surface:#111318;--border:#272b32;--text:#f5f7fa;--muted:#9aa3ae;--accent:#d5b45b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.card{width:min(430px,calc(100% - 32px));background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:28px;text-align:center}
.brand{font-weight:850;font-size:25px;letter-spacing:-.6px}.brand span{color:var(--accent)}
p{color:var(--muted);line-height:1.55;font-size:14px;margin:14px 0 22px}
a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 18px;border-radius:12px;background:var(--text);color:#08090b;text-decoration:none;font-weight:800;font-size:14px}
.small{display:block;margin-top:18px;color:#68717d;font-size:11px}
</style>
</head>
<body>
<main class="card">
  <div class="brand">Nuts<span> Tips</span></div>
  <p id="message">Nuts Tips’e yönlendiriliyorsun…</p>
  <a id="fallback" href="https://apps.apple.com/app/id6781012939">App Store’da Aç</a>
  <span class="small">Nuts Tips · nutstips.com</span>
</main>
<script>
(function(){
  const APP_STORE='https://apps.apple.com/app/id6781012939';
  const HOME='https://nutstips.com/';
  const ua=navigator.userAgent || '';
  const isIOS=/iPhone|iPad|iPod/i.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const isAndroid=/Android/i.test(ua);
  const message=document.getElementById('message');
  const fallback=document.getElementById('fallback');

  if(isIOS){
    fallback.href=APP_STORE;
    fallback.textContent='App Store’da Aç';
    setTimeout(()=>window.location.replace(APP_STORE),250);
    return;
  }

  if(isAndroid){
    fallback.href=HOME;
    fallback.textContent='Nuts Tips’e Git';
    message.textContent='Android sürümü çok yakında. Nuts Tips web sitesine yönlendiriliyorsun…';
    setTimeout(()=>window.location.replace(HOME),700);
    return;
  }

  fallback.href=HOME;
  fallback.textContent='Nuts Tips’e Git';
  message.textContent='Nuts Tips web sitesine devam et.';
})();
</script>
</body>
</html>
